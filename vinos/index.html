<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta de vinos · La Serena</title>
<meta name="description" content="Carta de vinos de La Serena, la cabaña junto al río. Av. Victorica 708, Tigre.">
<meta name="theme-color" content="#23402e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2323402e'/%3E%3Cpath d='M10 52 L32 12 L54 52' fill='none' stroke='%23b8862b' stroke-width='5' stroke-linejoin='round'/%3E%3Crect x='27' y='32' width='10' height='12' fill='none' stroke='%23f6f0e4' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root { --papel:#f6f0e4; --verde:#23402e; --oro:#b8862b; --barro:#a8502a; --tinta:#2a2520; --gris:#776e63; --linea:#d8ccb6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--verde); }
  body { background: var(--papel); color: var(--tinta); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; max-width: 560px; margin: 0 auto; min-height: 100vh; }
  header { background: var(--verde); color: var(--papel); text-align: center; padding: 28px 16px 22px; }
  header .marca { font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.32em; font-size: 13px; color: var(--oro); text-transform: uppercase; }
  header h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 34px; letter-spacing: 0.06em; margin: 10px 0 6px; }
  header .lema { font-family: Georgia, serif; font-style: italic; color: #d9c79f; font-size: 15px; }
  header svg { display: block; margin: 0 auto 10px; }
  nav { position: sticky; top: 0; z-index: 2; background: var(--papel); border-bottom: 1px solid var(--linea); display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav a { flex: none; text-decoration: none; color: var(--verde); border: 1px solid var(--linea); border-radius: 999px; padding: 6px 13px; font-size: 14px; background: #fbf7ee; }
  nav a:active { background: var(--verde); color: var(--papel); }
  main { padding: 6px 16px 10px; }
  section { padding-top: 18px; scroll-margin-top: 56px; }
  h2 { font-family: Georgia, serif; font-weight: 400; font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--verde); border-bottom: 2px solid var(--oro); padding-bottom: 5px; margin-bottom: 4px; }
  .vino { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dotted #cdbd9f; }
  .vino:last-child { border-bottom: none; }
  .vino .ft { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; flex: none; background: #ece2cd; }
  .vino .tx { flex: 1; min-width: 0; }
  .vino .n { font-weight: 600; font-size: 16px; line-height: 1.25; }
  .vino .d { font-family: Georgia, serif; font-style: italic; color: var(--gris); font-size: 13.5px; margin-top: 2px; }
  .vino .p { font-family: Bahnschrift, "Segoe UI", sans-serif; font-weight: 700; font-size: 16px; color: var(--verde); white-space: nowrap; }
  .descorche { margin: 22px 0 8px; border: 1.5px dashed var(--oro); border-radius: 10px; background: #fbf7ee; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .descorche b { font-family: Bahnschrift, sans-serif; color: var(--verde); }
  footer { text-align: center; padding: 22px 16px 30px; color: var(--gris); font-size: 13.5px; line-height: 1.7; border-top: 2px solid var(--oro); margin: 18px 16px 0; }
  footer .slainte { font-family: Georgia, serif; font-style: italic; color: var(--oro); font-size: 20px; margin-bottom: 6px; }
  footer a { color: var(--verde); font-weight: 600; text-decoration: none; }
  footer .boton { display: inline-block; margin: 12px 0 6px; background: var(--verde); color: var(--papel); border-radius: 999px; padding: 9px 18px; font-weight: 600; }
  footer small { display: block; margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <svg width="64" height="52" viewBox="0 0 64 52" aria-hidden="true"><path d="M4 48 L32 4 L60 48" fill="none" stroke="#b8862b" stroke-width="2.4" stroke-linejoin="round"/><rect x="27" y="24" width="10" height="13" fill="none" stroke="#f6f0e4" stroke-width="2"/><line x1="32" y1="24" x2="32" y2="37" stroke="#f6f0e4" stroke-width="2"/></svg>
  <div class="marca">La Serena</div>
  <h1>Carta de vinos</h1>
  <div class="lema">La cabaña junto al río</div>
</header>
<nav id="nav"></nav>
<main id="lista"></main>
<footer>
  <div class="slainte">¡Sláinte!</div>
  Pedile al mozo el vino que más te guste.<br>
  <a class="boton" href="../">Ver la carta completa</a><br>
  Av. Victorica 708, Tigre · <a href="https://instagram.com/laserenadelrio">@laserenadelrio</a><br>
  Reservas por WhatsApp: <a href="https://wa.me/5491153349375">+54 9 11 5334-9375</a>
  <small id="act"></small>
  <small>Beber con moderación. Prohibida su venta a menores de 18 años.</small>
</footer>
<script src="../datos/fudo.js"></script>
<script src="../datos/ajustes.js"></script>
<script src="vinos.js"></script>
<script>
  function slug(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-"); }
  var nav = "", html = "";
  VINOS.forEach(function (g) {
    var id = slug(g.grupo);
    nav += '<a href="#' + id + '">' + g.grupo + '</a>';
    html += '<section id="' + id + '"><h2>' + g.grupo + '</h2>';
    g.items.forEach(function (v) {
      html += '<div class="vino">' + (v.foto ? '<img class="ft" loading="lazy" alt="" src="' + v.foto + '">' : '') +
        '<div class="tx"><div class="n">' + v.nombre + '</div>' + (v.nota ? '<div class="d">' + v.nota + '</div>' : '') + '</div><div class="p">' + precio(v.precio) + '</div></div>';
    });
    html += '</section>';
  });
  if (DESCORCHE) html += '<div class="descorche"><span>¿Traés tu vino? Descorche</span><b>' + precio(DESCORCHE) + '</b></div>';
  document.getElementById("nav").innerHTML = nav;
  document.getElementById("lista").innerHTML = html;
  document.getElementById("act").textContent = "Precios actualizados al " + ACTUALIZADA.split(" ")[0] + ".";
</script>
</body>
</html>
